[project]
name = "pik2video"
version = "0.1.0"
description = "Простое  приложение для захвата экрана с двумя сценариями - запись видео и screen запись."
dependencies = [
    "requests>=2.32.5",
    "pyautogui>=0.9.54",
    "pyscreeze>=1.0.1",
    "opencv-python>=4.12.0.88",
    "numpy>=1.23.5",
    "mss>=10.1.0",
    "pyaudio>=0.2.14",
    "pillow>=12.1.0",
    "psutil>=7.2.1",
    "pyside6>=6.10.2",
]
readme = "README.md"
requires-python = ">=3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "watchdog>=6.0.0",
    "pyinstaller>=6.19.0",
    "ruff>=0.16.10",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",     # pyflakes — реальные проблемы
    "E",     # ошибки стиля
    "W",     # предупреждения стиля
    "I",     # порядок импортов
    "B",     # типичные баги
    "RUF",   # правила ruff (кроме кириллицы)
    "PLW",   # pylint warnings (кроме magic value)
    "PLR",   # pylint refactor (кроме сложных функций)
    "PIE",   # misc
]

ignore = [
    # ── Стиль, не критично ──
    "E501",    # длина строки
    "W293",    # пробелы в пустых строках
    "W291",    # пробелы в конце строк
    "PLW0603",
    
    # ── Кириллица — у нас русский проект ──
    "RUF001",  # кириллица в строке
    "RUF002",  # кириллица в docstring
    "RUF003",  # кириллица в комментарии

    # ── Осознанный выбор ──
    "BLE001",  # широкий except Exception
    "FA100",   # __future__ annotations
    "FA102",
    "DTZ005",  # datetime без tz
    "SIM102",  # свёрнутый if
    "UP045",   # PEP 604
    "S110",    # try/except/pass

    # ── Стиль / сложность — не критично ──
    "PLR2004", # магические числа
    "PLR0915", # слишком длинная функция
    "PLR0911", # слишком много return
    "PLR0913", # слишком много аргументов
    "PLR0917", # слишком много позиционных аргументов
    "PLR5501", # collapsible-else-if

    # ── Косметика ──
    "RUF005",  # список + список
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E", "F"]